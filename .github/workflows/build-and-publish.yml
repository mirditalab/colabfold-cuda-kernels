name: build-and-publish

on:
  push:
    branches: main
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
            plat: manylinux_2_28_x86_64
            # sm_100 and sm_120 need CUDA 12.8+; ubi8 gives manylinux_2_28
            cuda_image: nvidia/cuda:12.9.1-devel-ubi8
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
            plat: manylinux_2_28_aarch64
            # arm64 machines all run CUDA 13 drivers
            cuda_image: nvidia/cuda:13.4.1-devel-ubi8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Stage build-time headers
        run: |
          # Oldest supported jax: building on its headers keeps the wheel loadable on newer ones.
          pip install --upgrade -q pip wheel "jax==0.6.2"
          mkdir -p build
          cp -r "$(python -c 'import jax; print(jax.ffi.include_dir())')" build/ffi-include

      - name: Build wheel in CUDA 12.9
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            -e SKBUILD_CMAKE_DEFINE="CCK_FFI_INCLUDE_DIR=/io/build/ffi-include" \
            -e CUDACXX=/usr/local/cuda/bin/nvcc \
            "${{ matrix.cuda_image }}" bash -euo pipefail -c '
              # Install the static libstdc++ to make the library independent.
              dnf install -y -q python3.11 python3.11-pip libstdc++-static git
              python3.11 -m pip install -q build
              python3.11 -m build --wheel
            '

      - name: Audit shared library
        run: |
          mkdir -p audit && cd audit && unzip -q ../dist/*.whl
          so=colabfold_cuda_kernels/libcolabfold_cuda_kernels.so
          ldd "$so"
          # The library must link to the C library only.
          if ldd "$so" | grep -qE 'libcudart|libstdc\+\+|libgcc_s'; then
            echo "!! unexpected dynamic dependency in $so" >&2
            exit 1
          fi

      - name: Tag wheel
        run: python -m wheel tags --platform-tag ${{ matrix.plat }} --remove dist/*.whl

      - name: Smoke test
        run: |
          pip install -q pytest dist/*.whl
          cd /tmp && python -m pytest -q "$GITHUB_WORKSPACE/tests"

      - uses: actions/upload-artifact@v4
        with: { name: "wheels-linux-${{ matrix.arch }}", path: dist/*.whl }

  publish:
    needs: [build_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "wheels-*", merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }
